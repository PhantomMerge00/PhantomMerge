[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-merge"
version = "0.1.0"
description = "Phantom Merge: entity-evidence binding detection and correction (research artifact)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pandas>=2.0",
]

[project.optional-dependencies]
reproduce = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[project.scripts]
phantom-merge = "reproduce.l1.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reproduce*", "ccer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
